name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소권한 — changes 잡의 paths-filter 가 PR 변경 파일을 API 로 조회하려면
# pull-requests:read 가 필요하다. 그 외 잡은 checkout(contents:read)만 사용한다.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ───────────────────────────── 변경 영역 감지 ─────────────────────────────
  # 이번 push/PR 에서 실제로 바뀐 경로를 판별해 관련 잡만 실행한다.
  # (문서 전용 → 둘 다 skip / 백엔드만 → app skip / 앱만 → backend skip)
  changes:
    name: 변경 영역 감지
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'tests/**'
              - 'public/**'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon'
              - 'phpunit.dist.xml'
              - 'rector.php'
              - '.php-cs-fixer.dist.php'
              - 'env'
              - 'spark'
              - '.github/workflows/ci.yml'
            app:
              - 'app-mobile/**'
              - '.github/workflows/ci.yml'

  # ───────────────────────────── 백엔드 (CodeIgniter 4) ─────────────────────────────
  backend:
    name: Backend (PHP 8.5 · PHPStan · PHPUnit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동 (Docker)
        # self-hosted macOS 러너는 GitHub Actions `services:`(서비스 컨테이너)를
        # 지원하지 않는다 — Linux 러너 전용 기능이라 Mac에 설치된 Docker로 직접 기동한다.
        # 호스트 포트는 고정하지 않고 Docker가 빈 포트를 임의 할당하게 해
        # 같은 러너 Mac에서 이미 쓰는 로컬 MySQL·다른 저장소 CI 컨테이너와의 충돌을 피한다.
        run: |
          docker rm -f -v aicura-ci-mysql >/dev/null 2>&1 || true
          docker run -d --name aicura-ci-mysql \
            -e MYSQL_DATABASE=aicura \
            -e MYSQL_USER=aicura \
            -e MYSQL_PASSWORD="Aicura@2026!Dev" \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 127.0.0.1::3306 \
            mysql:8.0

          MYSQL_PORT="$(docker port aicura-ci-mysql 3306/tcp | head -1 | cut -d: -f2)"
          [ -n "$MYSQL_PORT" ] || { echo "MySQL 컨테이너 포트 확인 실패"; exit 1; }
          echo "MYSQL_PORT=$MYSQL_PORT" >> "$GITHUB_ENV"

          echo "MySQL 준비 대기 중... (포트 $MYSQL_PORT)"
          for i in $(seq 1 30); do
            if docker exec aicura-ci-mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then
              echo "MySQL 준비 완료"; break
            fi
            sleep 2
          done

      - name: PHP 설정
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, mysqli, curl, dom, xml, tokenizer
          # phpunit.dist.xml 이 failOnWarning + <coverage> 를 켜 두어
          # 커버리지 드라이버가 없으면 경고→실패. pcov 로 드라이버 제공.
          coverage: pcov
          tools: composer:v2

      - name: Composer 캐시
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env 준비
        run: |
          cp env .env
          {
            echo "app.baseURL = http://localhost:8300/"
            echo "JWT_SECRET = ci-test-secret-key-please-change-32chars-min"
            echo "database.default.hostname = 127.0.0.1"
            echo "database.default.port = ${MYSQL_PORT}"
            echo "database.default.database = aicura"
            echo "database.default.username = aicura"
            echo "database.default.password = Aicura@2026!Dev"
            echo "database.default.DBDriver = MySQLi"
          } >> .env

      - name: writable 디렉토리 준비 (git 미추적 — CI4 WRITEPATH 보장)
        run: |
          mkdir -p writable/cache writable/logs writable/logs/raw \
                   writable/session writable/uploads writable/debugbar
          chmod -R 777 writable

      - name: 코드 스타일 검사 (PHP CS Fixer)
        # dry-run — 포맷이 어긋난 파일이 있으면 실패(자동 수정 안 함).
        # 수정은 로컬에서 `composer cs:fix` 로 처리한다.
        run: composer cs

      - name: 정적 분석 (PHPStan)
        run: composer analyse

      - name: 테스트 DB 연결 정보 보정 (localhost → 127.0.0.1, 동적 포트 반영)
        # macOS(BSD) sed 는 -i 뒤에 백업 확장자 인자가 필수라 GNU sed 문법과 다르다.
        run: |
          sed -i '' \
            -e 's#name="database.tests.hostname" value="localhost"#name="database.tests.hostname" value="127.0.0.1"#' \
            -e "s#name=\"database.tests.port\" value=\"3306\"#name=\"database.tests.port\" value=\"${MYSQL_PORT}\"#" \
            phpunit.dist.xml

      - name: 단위·DB 테스트 (PHPUnit)
        run: composer test

      - name: MySQL 컨테이너 정리
        if: always()
        run: docker rm -f -v aicura-ci-mysql >/dev/null 2>&1 || true

  # ───────────────────────────── 앱 (Flutter) ─────────────────────────────
  app:
    name: App (Flutter · analyze · test)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: app-mobile

    steps:
      - uses: actions/checkout@v4

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 포맷 검사
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

  # ───────────────────────────── Slack 알림 (CI 실패 시) ─────────────────────────────
  # main 푸시(= dev → main 배포 PR 머지)에서 백엔드/앱 잡이 하나라도 실패하면 Slack 으로 통지한다.
  # PR 실행은 담당자가 PR 화면에서 바로 확인하므로 알림 대상에서 제외(소음 방지).
  notify:
    name: Slack 알림 (CI 실패)
    needs: [backend, app]
    if: failure() && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Slack CI 실패 알림
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          APP_RESULT: ${{ needs.app.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — Slack 알림 건너뜀"; exit 0
          fi
          # 커밋 메시지는 임의 문자열 → jq --arg 로 안전하게 JSON 이스케이프 (인젝션 차단)
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PAYLOAD="$(jq -n \
            --arg head "❌ CI 실패 — $REPO ($REF)" \
            --arg fields "*저장소* \`$REPO\`"$'\n'"*커밋* \`$SHORT_SHA\` — $COMMIT_MSG"$'\n'"*푸시* $ACTOR"$'\n'"*백엔드* $BACKEND_RESULT · *앱* $APP_RESULT" \
            --arg run "$RUN_URL" \
            '{
              text: $head,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ("*" + $head + "*") } },
                { type: "section", text: { type: "mrkdwn", text: $fields } },
                { type: "actions", elements: [
                  { type: "button", text: { type: "plain_text", text: "실행 로그 보기" }, url: $run }
                ]}
              ]
            }')"
          curl -sf -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" \
            && echo "Slack 알림 전송 완료" \
            || echo "Slack 알림 전송 실패"
