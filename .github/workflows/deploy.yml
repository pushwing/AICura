name: Deploy

# main 브랜치 푸시 시 프로덕션 서버로 SSH 배포
# (워크플로우: dev → main PR(Squash) → main 푸시 = 프로덕션 배포)
on:
  push:
    branches: [main]
  # 태그 릴리스나 롤백 시 수동 실행도 허용
  workflow_dispatch:

# 배포는 동시에 하나만 — 진행 중 배포가 끝난 뒤 최신 커밋으로 재배포
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (SSH)
    runs-on: ubuntu-latest
    # main 에 대한 검증은 CI 워크플로우(ci.yml)가 동일 푸시에서 병렬 수행한다.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 서버 배포 (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # 명령 중 하나라도 실패하면 즉시 중단 (set -e)
          script_stop: true
          script: |
            set -euo pipefail

            # 배포 경로 (서버의 프로젝트 루트) — 시크릿으로 주입
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "▶ 최신 코드 가져오기"
            git fetch --prune origin main
            git reset --hard origin/main

            # writable/ 은 git 미추적이라 프레시 서버엔 없다.
            # spark 커맨드(migrate 등)는 WRITEPATH가 없으면 부팅 자체가 실패하므로
            # 반드시 composer/migrate '이전'에 디렉토리를 만들어 둔다.
            echo "▶ writable 디렉토리·권한 보정 (아파치 실행 유저가 쓸 수 있도록)"
            mkdir -p writable/cache writable/logs writable/logs/raw \
                     writable/session writable/uploads writable/debugbar
            # setgid(g+s): 이 디렉토리 안에 배포 계정이 새로 만드는 파일이
            # 부모 디렉토리의 그룹(www-data)을 상속하게 해, 아파치가 쓸 수 있게 한다.
            # (서버에서 writable/ 를 aicura:www-data 소유로 1회 구성해 둔 것을 전제)
            chmod g+s writable writable/cache writable/logs writable/logs/raw \
                      writable/session writable/uploads writable/debugbar 2>/dev/null || true
            # chmod 는 best-effort: 런타임에 아파치(www-data)가 만든 캐시·세션 파일은
            # 배포 계정 소유가 아니라 chmod 가 실패한다(Operation not permitted).
            # 그 실패로 배포 전체가 중단되지 않도록 무시한다(set -e 회피).
            # 근본 해결은 서버에서 writable/ 를 setgid + 공용 그룹(www-data)으로 구성하는 것.
            chmod -R 2775 writable 2>/dev/null || echo "  (일부 파일 chmod 건너뜀 — 타 유저 소유, 무시)"

            echo "▶ Composer 의존성 설치 (프로덕션 — dev 제외)"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

            echo "▶ DB 마이그레이션"
            # 주의: php spark migrate 는 DB 연결 실패·마이그레이션 예외가 나도
            # 종료코드 0 을 반환한다(set -e 로 못 잡음). 출력을 캡처해 예외 패턴을
            # 직접 검사하고, 실패면 배포를 명시적으로 중단시킨다.
            MIGRATE_OUT="$(php spark migrate --all -f 2>&1)"
            echo "$MIGRATE_OUT"
            if echo "$MIGRATE_OUT" | grep -qiE '\[.*Exception\]|Unable to connect|Access denied|ERROR'; then
              echo "❌ 마이그레이션 실패 감지 — 배포 중단 (아파치 리로드 안 함)"
              exit 1
            fi

            echo "▶ 기본 관리자 계정 시드 (재실행 안전 — 이미 있으면 스킵)"
            # AdminUserSeeder 는 동일 이메일이 있으면 건너뛰므로 매 배포 실행해도 안전하다.
            # 마이그레이션과 달리 시드 실패는 치명적이지 않으나, 예외 패턴은 로그로 남긴다.
            SEED_OUT="$(php spark db:seed AdminUserSeeder 2>&1)"
            echo "$SEED_OUT"
            if echo "$SEED_OUT" | grep -qiE '\[.*Exception\]|Unable to connect|Access denied'; then
              echo "❌ 관리자 시드 실패 감지 — 배포 중단"
              exit 1
            fi

            echo "▶ 캐시 정리"
            php spark cache:clear || true

            echo "▶ 아파치 리로드 (OPcache 갱신 — 무중단)"
            # 아파치는 PHP 파일을 요청마다 해석하므로 재시작은 불필요하다.
            # OPcache가 켜져 있으면 캐시된 바이트코드가 남으므로 graceful 리로드로 갱신한다.
            #
            #  - mod_php  구성: 아파치 리로드로 OPcache까지 함께 갱신됨 (아래 기본값)
            #  - PHP-FPM  구성: 아파치 대신 php-fpm 을 리로드해야 OPcache 갱신됨
            #      예) sudo -n systemctl reload php8.4-fpm
            #
            # sudo -n: 비대화형(-n)이라 NOPASSWD 미설정 시 멈추지 않고 즉시 실패한다.
            #   서버 준비: /etc/sudoers.d/aicura-deploy 에
            #   '<DEPLOY_USER> ALL=(ALL) NOPASSWD: /usr/bin/systemctl reload apache2'
            # 배포판별 아파치 서비스명: Debian/Ubuntu = apache2, RHEL/CentOS = httpd
            sudo -n systemctl reload apache2

            echo "✅ 배포 완료: $(git rev-parse --short HEAD)"
