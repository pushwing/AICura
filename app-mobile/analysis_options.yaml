include: package:flutter_lints/flutter.yaml

analyzer:
  # iOS SwiftPM 이 build/ios/SourcePackages 에 패키지 소스(테스트 포함)를 그대로 vendoring 하므로 분석 대상에서 제외
  exclude:
    - build/**

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    # 콤마 배치는 `dart format`(tall style)이 관리하므로 require_trailing_commas 는 비활성화
    # (둘을 함께 켜면 포맷터와 린터가 충돌)
